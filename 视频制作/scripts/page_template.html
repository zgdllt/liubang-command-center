<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
@font-face{font-family:'Brush';src:url('__FONT_ZHIMANG__') format('truetype');}
@font-face{font-family:'Mashan','Caveat',cursive;src:url('__FONT_MASHAN__') format('truetype');}
@font-face{font-family:'Kai';src:url('__FONT_WENKAI__') format('truetype');}
@font-face{font-family:'Caveat';src:url('__FONT_CAVEAT__') format('truetype');}
:root{
  --ink:#1d1a16; --ink2:#3b352d; --ink3:#6a6155;
  --paper:#efe6d3; --paper2:#e7dbc2; --paper3:#f7f1e4;
  --red:#b03a2b; --red2:#c9553f; --gold:#8f7238;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0f0d0b;}
body.record{cursor:none;}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper);
  font-family:'Kai',serif;color:var(--ink);}
/* 纸 */
#paper{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 40%, #f6efe0 0%, #efe6d3 45%, #e2d5bb 100%);}
#paper:after{content:'';position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='260' height='260' filter='url(%23n)' opacity='0.16'/></svg>");}
#vignette{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 260px 40px rgba(60,42,20,.35), inset 0 0 60px rgba(60,42,20,.18);}
#wash{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.5;
  background:radial-gradient(50% 40% at 12% 88%, rgba(90,74,52,.25), transparent 70%),
             radial-gradient(40% 40% at 92% 8%, rgba(90,74,52,.18), transparent 70%);}
/* 场景层 */
#scenes{position:absolute;inset:0;z-index:1;}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform;}
.art{position:absolute;inset:0;overflow:hidden;}
.plate{position:absolute;background:linear-gradient(175deg,#fbf6ea,#f1e7d2);padding:16px;
  box-shadow:0 26px 60px rgba(60,42,20,.30), 0 2px 0 rgba(255,255,255,.7) inset;
  border:1px solid rgba(120,96,62,.30);}
.plate img{width:100%;height:100%;object-fit:contain;display:block;
  filter:contrast(1.03) saturate(.97) sepia(.05);}
.plate:after{content:'';position:absolute;inset:8px;border:1px solid rgba(120,96,62,.18);pointer-events:none;}
.plate .cap{position:absolute;left:34px;bottom:-34px;font-family:'Kai';font-size:19px;
  color:rgba(90,74,52,.75);letter-spacing:.14em;}
.textzone{position:absolute;}
.textzone .kicker{position:static;border-left:0;padding-left:0;font-size:23px;letter-spacing:.34em;}
.textzone .headline{position:static;font-size:84px;line-height:1.22;text-wrap:balance;}
.textzone .sub{position:static;margin-top:30px;font-size:30px;line-height:1.78;border-left:2px solid rgba(176,58,43,.4);}
.art img{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;
  filter:contrast(1.04) saturate(.96) sepia(.06);}
.art:after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg, rgba(239,230,211,.94) 0%, rgba(239,230,211,.72) 26%, rgba(239,230,211,.10) 52%, rgba(239,230,211,0) 72%);}
.art.right:after{background:linear-gradient(260deg, rgba(239,230,211,.94) 0%, rgba(239,230,211,.7) 26%, rgba(239,230,211,.08) 52%, rgba(239,230,211,0) 72%);}
.art.soft:after{background:linear-gradient(180deg, rgba(239,230,211,.55) 0%, rgba(239,230,211,.15) 40%, rgba(239,230,211,.30) 100%);}
/* 标题组 */
.kicker{position:absolute;font-family:'Kai';font-size:24px;letter-spacing:.32em;color:var(--red);
  border-left:3px solid var(--red);padding-left:14px;opacity:.92;}
.headline{position:absolute;font-family:'Mashan','Caveat',cursive;color:var(--ink);
  line-height:1.18;letter-spacing:.02em;white-space:pre-wrap;text-wrap:balance;}
.headline .ch{display:inline-block;opacity:0;will-change:transform,opacity;}
.sub{position:absolute;font-family:'Kai';color:var(--ink2);line-height:1.75;
  letter-spacing:.03em;border-left:2px solid rgba(176,58,43,.45);padding-left:22px;}
.rule{position:absolute;height:3px;background:var(--red);transform-origin:left center;opacity:.85;}
/* 竖排原文 */
.scroll{position:absolute;background:linear-gradient(180deg,#f7f0df,#eadfc6);
  box-shadow:0 18px 50px rgba(60,42,20,.28), 0 2px 0 rgba(255,255,255,.6) inset;
  border:1px solid rgba(120,96,62,.28);}
.scroll:before{content:'';position:absolute;inset:10px;border:1px solid rgba(120,96,62,.22);}
.vert{writing-mode:vertical-rl;text-orientation:upright;font-family:'Kai';
  letter-spacing:.18em;line-height:2.05;color:var(--ink);}
.vert .ch{display:inline-block;opacity:0;}
.seal{position:absolute;background:var(--red);color:#f7efe0;font-family:'Mashan','Caveat',cursive;
  display:flex;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 3px 10px rgba(120,30,20,.35);mix-blend-mode:multiply;}
.seal:after{content:'';position:absolute;inset:0;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.55' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23m)'/></svg>");}
/* 卡片 */
.card{position:absolute;background:linear-gradient(175deg,#faf4e5,#efe4cb);
  border:1px solid rgba(120,96,62,.30);box-shadow:0 12px 30px rgba(60,42,20,.20);
  padding:34px 30px;opacity:0;will-change:transform,opacity;}
.card .t{font-family:'Mashan','Caveat',cursive;font-size:46px;color:var(--ink);margin-bottom:12px;}
.card .d{font-family:'Kai';font-size:25px;color:var(--ink2);line-height:1.62;}
.card .s{font-family:'Kai';font-size:22px;color:var(--red);margin-top:12px;letter-spacing:.08em;}
.card .idx{position:absolute;top:-24px;left:-24px;width:56px;height:56px;border-radius:50%;
  background:var(--red);color:#f8f1e2;font-family:'Mashan','Caveat',cursive;font-size:32px;
  display:flex;align-items:center;justify-content:center;}
/* 分屏 */
.panel{position:absolute;opacity:0;will-change:transform,opacity;}
.panel .t{font-family:'Mashan','Caveat',cursive;font-size:52px;color:var(--ink);margin-bottom:16px;}
.panel .d{font-family:'Kai';font-size:27px;line-height:1.7;color:var(--ink2);}
.panel .k{font-family:'Mashan','Caveat',cursive;font-size:150px;color:rgba(176,58,43,.20);position:absolute;
  right:8px;top:-40px;line-height:1;}
.divider{position:absolute;width:2px;background:linear-gradient(180deg,transparent,rgba(90,74,52,.5),transparent);}
/* 步骤 */
.step{position:absolute;opacity:0;will-change:transform,opacity;display:flex;gap:22px;align-items:flex-start;}
.step .n{flex:none;width:64px;height:64px;border-radius:50%;border:2px solid var(--red);
  color:var(--red);font-family:'Mashan','Caveat',cursive;font-size:34px;display:flex;align-items:center;
  justify-content:center;background:rgba(247,241,228,.7);}
.step .t{font-family:'Mashan','Caveat',cursive;font-size:44px;color:var(--ink);line-height:1.25;}
.step .d{font-family:'Kai';font-size:24px;color:var(--ink2);line-height:1.6;margin-top:6px;}
.dash{position:absolute;border-left:2px dashed rgba(176,58,43,.35);}
/* 逐字大句 */
.bigline{position:absolute;font-family:'Mashan','Caveat',cursive;color:var(--ink);line-height:1.22;text-align:center;text-wrap:balance;}
.bigline .ch{display:inline-block;opacity:0;}
.inkblot{position:absolute;opacity:0;
  -webkit-mask-image:radial-gradient(closest-side, #000 42%, rgba(0,0,0,.55) 62%, transparent 78%);
  mask-image:radial-gradient(closest-side, #000 42%, rgba(0,0,0,.55) 62%, transparent 78%);
  filter:contrast(1.15) saturate(.9);}
/* 对话 */
.qa{position:absolute;opacity:0;will-change:transform,opacity;max-width:820px;}
.qa .who{font-family:'Mashan','Caveat',cursive;font-size:30px;color:var(--red);margin-bottom:6px;letter-spacing:.08em;}
.qa .txt{font-family:'Kai';font-size:34px;color:var(--ink);line-height:1.55;
  background:rgba(250,244,229,.78);padding:16px 26px;border:1px solid rgba(120,96,62,.22);
  box-shadow:0 8px 20px rgba(60,42,20,.10);}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:300;}
#chapter{position:absolute;left:64px;top:56px;writing-mode:vertical-rl;font-family:'Kai';
  font-size:22px;letter-spacing:.34em;color:rgba(70,58,42,.75);}
#brand{position:absolute;right:62px;top:54px;width:96px;height:96px;font-size:26px;line-height:1.1;}
#epno{position:absolute;right:70px;top:170px;font-family:'Kai';font-size:20px;letter-spacing:.2em;
  color:rgba(70,58,42,.65);text-align:center;width:80px;}
#progress{position:absolute;left:0;bottom:0;height:4px;background:var(--red);width:0;}
/* 字幕 */
#subs{position:absolute;left:0;right:0;bottom:118px;height:172px;pointer-events:none;z-index:400;}
#subs .cue{position:absolute;left:0;right:0;top:0;margin:0 auto;text-align:center;opacity:0;}
#subs .cue span{display:inline-block;font-family:'Kai';font-size:43px;line-height:1.42;color:#f7f0df;
  white-space:pre-line;
  background:linear-gradient(180deg, rgba(26,22,17,.86), rgba(38,31,23,.86));
  padding:12px 34px 14px;border-radius:3px;
  box-shadow:0 8px 30px rgba(0,0,0,.38), inset 0 0 0 1px rgba(214,196,160,.25);
  letter-spacing:.05em;}
#subs .cue .sub2{display:block;font-size:34px;opacity:.92;margin-top:2px;}
/* 封面 / 结束 */
.cover{position:absolute;left:120px;top:250px;width:1080px;}
.cover .kicker{position:static;border:0;padding:0;font-size:28px;letter-spacing:.5em;margin-bottom:26px;}
.cover .hl{font-family:'Mashan','Caveat',cursive;font-size:126px;line-height:1.14;color:var(--ink);}
.cover .hl .ch{display:inline-block;opacity:0;}
.cover .sub2{font-family:'Kai';font-size:33px;line-height:1.8;color:#332c24;margin-top:34px;
  max-width:900px;}
.cover .stamp{position:static;width:120px;height:120px;font-size:34px;margin-top:38px;}
.finale{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:34px;}
.finale .hl{font-family:'Mashan','Caveat',cursive;font-size:150px;color:var(--ink);letter-spacing:.04em;}
.finale .sub2{font-family:'Kai';font-size:40px;color:var(--ink2);letter-spacing:.12em;}
.finale .hint{font-family:'Kai';font-size:28px;color:var(--ink3);letter-spacing:.3em;opacity:0;}
.dark{position:absolute;inset:0;background:#17140f;opacity:0;}
.brush{position:absolute;height:26px;background:linear-gradient(90deg,transparent,var(--ink) 8%,var(--ink) 92%,transparent);opacity:.85;}
</style>
</head>
<body class="record">
<div id="stage">
  <div id="paper"></div>
  <div id="scenes"></div>
  <div id="wash"></div>
  <div id="vignette"></div>
  <div id="hud">
    <div id="chapter"></div>
    <div id="brand" class="seal">汉营</div>
    <div id="epno"></div>
    <div id="progress"></div>
  </div>
  <div id="dark" class="dark"></div>
  <div id="subs"></div>
</div>
<script>
const DATA = __DATA__;
const ASSETS = __ASSETS__;
const STAGE_W = 1920, STAGE_H = 1080;
const el = (tag, cls, parent) => { const n = document.createElement(tag); if (cls) n.className = cls;
  if (parent) parent.appendChild(n); return n; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const outCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const outBack = (t) => { t = clamp(t, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;

function splitChars(node, text, cls) {
  node.textContent = '';
  const spans = [];
  for (const ch of text) {
    if (ch === '\n') { node.appendChild(document.createElement('br')); continue; }
    const s = el('span', 'ch', node); s.textContent = ch; spans.push(s);
  }
  return spans;
}
function revealChars(spans, t, t0, per, dur, rise) {
  spans.forEach((s, i) => {
    const p = clamp((t - (t0 + i * per)) / dur, 0, 1);
    s.style.opacity = p;
    s.style.transform = `translateY(${(1 - p) * (rise === undefined ? 18 : rise)}px) rotate(${(1 - p) * -1.2}deg)`;
  });
}
function stamp(node, t, t0) {
  const p = clamp((t - t0) / 0.45, 0, 1);
  const s = p === 0 ? 0 : 1.55 - 0.55 * p - (p >= 1 ? 0 : Math.sin(p * Math.PI) * 0.15);
  const sc = outBack(p);
  node.style.opacity = clamp(p * 2.2, 0, 1);
  node.style.transform = `scale(${0.6 + 0.4 * sc}) rotate(${lerp(-6, -3, p)}deg)`;
}

const scenes = [];
const built = [];
let DATA_BEATS = DATA.beats;

function assetURL(k) { return ASSETS[k] || ''; }

function artLayer(scene, key, cls) {
  const wrap = el('div', 'art ' + (cls || ''), scene);
  const img = el('img', '', wrap);
  img.src = assetURL(key);
  return { wrap, img };
}

function baseScene(b) {
  const s = el('div', 'scene', document.getElementById('scenes'));
  const o = { b, node: s, items: [], chars: [], extras: [] };
  return o;
}

/* ---------- 各版式 ---------- */
function buildTitle(b) {
  const o = baseScene(b);
  if (b.asset) {
    const a = artLayer(o.node, b.asset, '');
    a.wrap.style.opacity = .92;
    o.art = a;
    const veil = el('div', '', o.node);
    veil.style.cssText = 'position:absolute;inset:0;background:linear-gradient(100deg,rgba(243,235,219,.99) 0%,rgba(243,235,219,.96) 40%,rgba(243,235,219,.55) 66%,rgba(243,235,219,.12) 88%)';
  }
  const cover = el('div', 'cover', o.node);
  const kick = el('div', 'kicker', cover); kick.textContent = b.kicker || '';
  const hl = el('div', 'hl', cover);
  o.chars = splitChars(hl, b.headline);
  const sub = el('div', 'sub2', cover); sub.textContent = b.sub || '';
  o.sub = sub;
  const stampEl = el('div', 'seal stamp', cover); stampEl.textContent = b.stamp || '汉营';
  o.stamp = stampEl;
  if (b.asset) o.artImg = o.art.img;
  o.update = (t, local) => {
    revealChars(o.chars, t, local + 0.25, 0.055, 0.5, 26);
    const p = clamp((t - local - 0.7) / 0.7, 0, 1);
    o.sub.style.opacity = p; o.sub.style.transform = `translateY(${(1 - p) * 16}px)`;
    if (o.artImg) { const k = clamp((t - local) / (b.end - b.start), 0, 1);
      o.artImg.style.transform = `scale(${1.04 + 0.05 * k})`; }
    stamp(o.stamp, t, local + 1.15);
  };
  return o;
}

function buildScene(b) {
  const o = baseScene(b);
  const full = b.artSide === 'full';
  if (b.asset) {
    if (full) {
      const a = artLayer(o.node, b.asset, '');
      o.artImg = a.img;
      const veil = el('div', '', o.node);
      veil.style.cssText = 'position:absolute;inset:0;background:linear-gradient(95deg,rgba(243,235,219,.97) 0%,rgba(243,235,219,.90) 34%,rgba(243,235,219,.35) 56%,rgba(243,235,219,0) 74%)';
      o.veil = veil;
    } else {
      const plate = el('div', 'plate', o.node);
      plate.style.left = '936px'; plate.style.top = '238px';
      plate.style.width = '862px'; plate.style.height = '505px';
      plate.style.transform = 'rotate(0.7deg)';
      const img = el('img', '', plate); img.src = assetURL(b.asset);
      o.plate = plate; o.artImg = img;
      if (b.caption) { const c = el('div', 'cap', plate); c.textContent = b.caption; o.cap = c; }
    }
  }
  const tz = el('div', 'textzone', o.node);
  tz.style.left = '104px'; tz.style.top = full ? '176px' : '196px';
  tz.style.width = full ? '1010px' : '820px';
  const kick = el('div', 'kicker', tz); kick.textContent = b.kicker || '';
  kick.style.marginBottom = '18px';
  kick.style.opacity = b.kicker ? 1 : 0;
  const hl = el('div', 'headline', tz);
  const hlen = (b.headline || '').length;
  hl.style.fontSize = (hlen > 13 ? 62 : hlen > 10 ? 70 : hlen > 7 ? 82 : 92) + 'px';
  o.chars = splitChars(hl, b.headline || '');
  const rule = el('div', 'rule', tz);
  rule.style.cssText = 'position:static;width:170px;height:3px;margin-top:22px;transform:scaleX(0);';
  o.rule = rule;
  if (b.sub) {
    const sub = el('div', 'sub', tz);
    sub.textContent = b.sub; o.sub = sub;
  }
  o.update = (t, local) => {
    if (o.artImg) {
      const k = clamp((t - b.start) / Math.max(0.1, b.end - b.start), 0, 1);
      if (o.plate) {
        const p = outCubic((t - local) / 0.8);
        o.plate.style.opacity = clamp(p * 1.4, 0, 1);
        o.plate.style.transform = `rotate(${lerp(2.2, 0.7, p)}deg) translateY(${(1 - p) * 26}px) scale(${lerp(0.97, 1, p)})`;
        o.artImg.style.transform = `scale(${1.02 + 0.03 * k})`;
      } else {
        o.artImg.style.transform = `scale(${1.05 + 0.07 * k}) translate(${(k - .5) * -16}px, 0)`;
      }
    }
    revealChars(o.chars, t, local + 0.22, 0.045, 0.45, 22);
    const rp = smooth((t - local - 0.45) / 0.5);
    o.rule.style.transform = `scaleX(${rp})`;
    if (o.sub) { const p = clamp((t - local - 0.6) / 0.6, 0, 1);
      o.sub.style.opacity = p; o.sub.style.transform = `translateY(${(1 - p) * 12}px)`; }
  };
  return o;
}

function buildQuote(b) {
  const o = baseScene(b);
  if (b.asset) {
    const plate = el('div', 'plate', o.node);
    plate.style.left = '1150px'; plate.style.top = '252px';
    plate.style.width = '660px'; plate.style.height = '392px';
    plate.style.transform = 'rotate(-0.9deg)';
    plate.style.opacity = .95;
    const img = el('img', '', plate); img.src = assetURL(b.asset);
    o.plate = plate; o.artImg = img;
  }
  const len = (b.text || '').length;
  let fs = 52;
  const availH = 418;
  let cols = 1, perCol = 1, panelW = 0, colAdv = 0;
  for (const cand of [52, 47, 42, 38, 34, 30, 27]) {
    fs = cand;
    perCol = Math.max(4, Math.floor((availH - 14) / fs));
    cols = Math.max(1, Math.ceil(len / perCol));
    colAdv = fs * 1.94;
    panelW = cols * colAdv + 250;
    if (panelW <= 1260) break;
  }
  const textW = cols * colAdv;
  const swidth = panelW;
  const sc = el('div', 'scroll', o.node);
  sc.style.left = (b.asset ? '120px' : `${Math.round((1920 - swidth) / 2)}px`); sc.style.top = '140px';
  sc.style.width = swidth + 'px';
  sc.style.height = '618px';
  sc.style.transform = 'rotate(-0.5deg)';
  o.scroll = sc;
  const kick = el('div', 'kicker', sc); kick.textContent = b.kicker || '';
  kick.style.left = '58px'; kick.style.top = '46px'; kick.style.opacity = b.kicker ? .95 : 0;
  const vert = el('div', 'vert', sc);
  const padRight = 26;
  vert.style.cssText = 'position:absolute;right:' + padRight + 'px;top:92px;bottom:100px;font-size:' + fs + 'px;line-height:1.9;';
  o.chars = splitChars(vert, b.text || '');
  const src = el('div', '', sc);
  src.style.cssText = 'position:absolute;left:142px;bottom:34px;font-family:Kai;font-size:21px;color:rgba(90,74,52,.82);letter-spacing:.1em';
  src.textContent = b.src || '';
  o.src = src;
  const st = el('div', 'seal', sc); st.textContent = '史';
  st.style.cssText += 'left:48px;top:auto;bottom:118px;width:68px;height:68px;font-size:26px;';
  o.stamp = st;
  o.update = (t, local) => {
    const p = smooth((t - local) / 0.7);
    o.scroll.style.opacity = clamp(p * 2, 0, 1);
    o.scroll.style.transform = `rotate(${lerp(-1.4, -0.5, p)}deg) translateY(${(1 - p) * 22}px)`;
    if (o.plate) { const pp = outCubic((t - local - 0.1) / 0.9);
      o.plate.style.opacity = pp;
      o.plate.style.transform = `rotate(${lerp(-2.6, -0.9, pp)}deg) translateY(${(1 - pp) * 24}px)`; }
    revealChars(o.chars, t, local + 0.42, 0.05, 0.3, 8);
    o.src.style.opacity = clamp((t - local - 0.42 - o.chars.length * 0.045) / 0.5, 0, 1);
    stamp(o.stamp, t, local + 0.9);
  };
  return o;
}

function buildCards(b) {
  const o = baseScene(b);
  if (b.asset) {
    const a = artLayer(o.node, b.asset, 'soft'); o.artImg = a.img; a.wrap.style.opacity = .30;
  }
  const kick = el('div', 'kicker', o.node); kick.textContent = b.kicker || '';
  kick.style.left = '120px'; kick.style.top = '150px';
  const hl = el('div', 'headline', o.node);
  hl.style.left = '120px'; hl.style.top = '196px'; hl.style.width = '1500px'; hl.style.fontSize = '66px';
  o.chars = splitChars(hl, b.headline || '');
  const items = b.items || [];
  const n = items.length;
  const twoRows = n > 4;
  const cols = twoRows ? Math.ceil(n / 2) : n;
  const rows = twoRows ? Math.ceil(n / cols) : 1;
  const GAP = twoRows ? 34 : n <= 3 ? 40 : 28;
  const top = twoRows ? (rows > 2 ? 318 : 330) : 352;
  const W = twoRows ? Math.min(470, Math.floor((1770 - (cols - 1) * GAP) / cols))
                    : n <= 3 ? 500 : 400;
  const rowStep = rows > 2 ? 188 : (twoRows ? 206 : 0);
  const total = cols * W + (cols - 1) * GAP;
  const x0 = Math.max(80, (STAGE_W - total) / 2);
  items.forEach((it, i) => {
    const c = el('div', 'card', o.node);
    const row = twoRows ? Math.floor(i / cols) : 0, col = twoRows ? i % cols : i;
    c.style.left = (x0 + col * (W + GAP)) + 'px';
    c.style.top = (top + row * rowStep) + 'px';
    c.style.width = W + 'px';
    c.style.minHeight = (rows > 2 ? 168 : twoRows ? 178 : 340) + 'px';
    if (twoRows) c.style.padding = '24px 24px';
    if (it.k) { const idx = el('div', 'idx', c); idx.textContent = it.k; }
    const t = el('div', 't', c); t.textContent = it.t;
    const tl = (it.t || '').length;
    t.style.fontSize = (twoRows ? (cols > 3 ? 28 : tl > 9 ? 30 : 36) : (tl > 11 ? 34 : tl > 8 ? 39 : 46)) + 'px';
    t.style.marginBottom = twoRows ? '6px' : '12px';
    t.style.textWrap = 'balance';
    const d = el('div', 'd', c); d.textContent = it.d;
    if (twoRows) d.style.fontSize = '23px';
    if (it.s) { const s = el('div', 's', c); s.textContent = it.s; if (twoRows) s.style.marginTop = '8px'; }
    o.items.push({ node: c, h: 340, tilt: (i % 2 === 0 ? -1 : 1) * (0.6 + (i % 3) * 0.35) });
  });
  o.update = (t, local) => {
    revealChars(o.chars, t, local + 0.1, 0.04, 0.4, 16);
    o.items.forEach((it, i) => {
      const t0 = local + 0.45 + i * 1.0;
      const p = outBack((t - t0) / 0.55);
      it.node.style.opacity = clamp((t - t0) / 0.25, 0, 1);
      it.node.style.transform = `translateY(${(1 - p) * 46}px) rotate(${it.tilt * (1 - clamp(p,0,1))}deg)`;
    });
  };
  return o;
}

function buildSplit(b) {
  const o = baseScene(b);
  if (b.asset) {
    const a = artLayer(o.node, b.asset, 'soft'); a.wrap.style.opacity = .25; o.artImg = a.img;
  }
  const kick = el('div', 'kicker', o.node); kick.textContent = b.kicker || '';
  kick.style.left = '120px'; kick.style.top = '146px';
  const hl = el('div', 'headline', o.node);
  hl.style.left = '120px'; hl.style.top = '190px'; hl.style.width = '1600px'; hl.style.fontSize = '64px';
  o.chars = splitChars(hl, b.headline || '');
  const items = b.items || [];
  const div = el('div', 'divider', o.node); div.style.left = '960px'; div.style.top = '380px'; div.style.height = '460px';
  o.divider = div;
  items.slice(0, 2).forEach((it, i) => {
    const p = el('div', 'panel', o.node);
    p.style.left = (i === 0 ? 140 : 1010) + 'px'; p.style.top = '420px'; p.style.width = '780px';
    if (it.k) { const k = el('div', 'k', p); k.textContent = it.k; }
    const t = el('div', 't', p); t.textContent = it.t;
    const d = el('div', 'd', p); d.textContent = it.d;
    o.items.push({ node: p, tilt: i === 0 ? -0.8 : 0.8 });
  });
  o.update = (t, local) => {
    revealChars(o.chars, t, local + 0.1, 0.04, 0.4, 16);
    const dp = smooth((t - local - 0.4) / 0.8);
    o.divider.style.opacity = dp;
    o.items.forEach((it, i) => {
      const t0 = local + 0.55 + i * 1.1;
      const p = outCubic((t - t0) / 0.7);
      it.node.style.opacity = clamp(p * 1.4, 0, 1);
      it.node.style.transform = `translateX(${(1 - p) * (i === 0 ? -60 : 60)}px) rotate(${it.tilt}deg)`;
    });
  };
  return o;
}

function buildSteps(b) {
  const o = baseScene(b);
  if (b.asset) {
    const plate = el('div', 'plate', o.node);
    plate.style.left = '1140px'; plate.style.top = '346px';
    plate.style.width = '690px'; plate.style.height = '392px';
    plate.style.transform = 'rotate(0.9deg)';
    const img = el('img', '', plate); img.src = assetURL(b.asset);
    o.plate = plate; o.artImg = img;
  }
  const kick = el('div', 'kicker', o.node); kick.textContent = b.kicker || '';
  kick.style.left = '120px'; kick.style.top = '142px';
  const hl = el('div', 'headline', o.node);
  hl.style.left = '120px'; hl.style.top = '186px'; hl.style.width = '1500px'; hl.style.fontSize = '64px';
  o.chars = splitChars(hl, b.headline || '');
  const items = b.items || [];
  const many = items.length > 5;
  const top0 = 298, rowH = Math.min(many ? 74 : 128, 476 / Math.max(1, items.length));
  o.line = el('div', 'dash', o.node);
  o.line.style.left = '150px'; o.line.style.top = (top0 + 32) + 'px';
  o.line.style.height = '0px';
  items.forEach((it, i) => {
    const row = el('div', 'step', o.node);
    row.style.left = '120px'; row.style.top = (top0 + i * rowH) + 'px';
    row.style.width = (b.asset ? '1000' : '1600') + 'px';
    const n = el('div', 'n', row); n.textContent = it.t;
    n.style.width = n.style.height = (many ? '50' : '60') + 'px';
    n.style.fontSize = (many ? '26' : '32') + 'px';
    const body = el('div', '', row);
    const t = el('div', 't', body); t.textContent = it.t2 || it.d;
    t.style.fontSize = (many ? '34' : '42') + 'px';
    if (it.s) { const d = el('div', 'd', body); d.textContent = it.s; }
    o.items.push({ node: row });
  });
  o.update = (t, local) => {
    if (o.plate) { const pp = outCubic((t - local - 0.05) / 0.8);
      o.plate.style.opacity = clamp(pp * 1.3, 0, 1);
      o.plate.style.transform = `rotate(${lerp(2.6, 0.9, pp)}deg) translateY(${(1 - pp) * 24}px)`; }
    revealChars(o.chars, t, local + 0.1, 0.04, 0.4, 16);
    const avail = Math.max(1.2, (b.end - b.start) * 0.72);
    o.items.forEach((it, i) => {
      const t0 = local + 0.55 + i * (avail / Math.max(1, items.length));
      const p = outCubic((t - t0) / 0.5);
      it.node.style.opacity = clamp(p * 1.5, 0, 1);
      it.node.style.transform = `translateX(${(1 - p) * -36}px)`;
    });
    const lp = smooth((t - local - 0.45) / (avail * 0.9));
    o.line.style.height = `${lp * (items.length - 1) * rowH}px`;
    o.line.style.opacity = lp > 0 ? .5 : 0;
  };
  return o;
}

function buildBigline(b) {
  const o = baseScene(b);
  if (b.asset) {
    const a = artLayer(o.node, b.asset, 'soft'); a.wrap.style.opacity = .22; o.artImg = a.img;

  blot.style.cssText = 'left:400px;top:60px;width:1120px;height:700px;';
  o.blot = blot;
  const hl = el('div', 'bigline', o.node);

  hl.style.left = '160px'; hl.style.top = '330px'; hl.style.width = '1600px';

  o.chars = splitChars(hl, b.headline || '');
  if (b.sub) {

    if (o.sub) { const p = clamp((t - local - 0.9) / 0.6, 0, 1);
      o.sub.style.opacity = p; o.sub.style.transform = `translateX(-50%) translateY(${(1 - p) * 14}px)`; }
  };
  return o;
}

function buildQA(b) {
  const o = baseScene(b);
  const kick = el('div', 'kicker', o.node); kick.textContent = b.kicker || '';
  kick.style.left = '120px'; kick.style.top = '120px';
  const hl = el('div', 'headline', o.node);
  hl.style.left = '120px'; hl.style.top = '162px'; hl.style.width = '1600px'; hl.style.fontSize = '56px';
  o.chars = splitChars(hl, b.headline || '');

    const q = el('div', 'qa', o.node);

function buildList(b) {
  const o = baseScene(b);
  if (b.asset) {
    const plate = el('div', 'plate', o.node);

  }

  kick.style.left = '120px'; kick.style.top = '150px';
  const hl = el('div', 'headline', o.node);
  hl.style.left = '120px'; hl.style.top = '194px'; hl.style.width = '1400px'; hl.style.fontSize = '64px';
  o.chars = splitChars(hl, b.headline || '');
  const items = b.items || [];
  items.forEach((it, i) => {
    const row = el('div', 'step', o.node);
    row.style.left = '130px'; row.style.top = (346 + i * 112) + 'px'; row.style.width = '1200px';
    const n = el('div', 'n', row); n.textContent = '·'; n.style.border = '0'; n.style.color = 'var(--red)';
    const body = el('div', '', row);
    const t = el('div', 't', body); t.textContent = it.t;

  });
  o.update = (t, local) => {
    if (o.plate) { const pp = outCubic((t - local - 0.05) / 0.8);
      o.plate.style.opacity = clamp(pp * 1.3, 0, 1);
      o.plate.style.transform = `rotate(${lerp(-2.4, -0.8, pp)}deg) translateY(${(1 - pp) * 24}px)`; }
    revealChars(o.chars, t, local + 0.1, 0.04, 0.4, 14);
    const avail = Math.max(1, (b.end - b.start) * 0.7);
    o.items.forEach((r, i) => {
      const t0 = local + 0.45 + i * (avail / Math.max(1, items.length));
      const p = outCubic((t - t0) / 0.5);
      r.style.opacity = clamp(p * 1.5, 0, 1);
      r.style.transform = `translateX(${(1 - p) * -40}px)`;

}

function buildEnd(b) {
  const o = baseScene(b);
  const fin = el('div', 'finale', o.node);
  const hl = el('div', 'hl', fin);
  o.chars = splitChars(hl, b.headline || '');
  const sub = el('div', 'sub2', fin); sub.textContent = b.sub || ''; o.sub = sub;
  const hint = el('div', 'hint', fin); hint.textContent = b.hint || '说「开始」'; o.hint = hint;
  const st = el('div', 'seal', fin); st.textContent = '刘邦';
  st.style.cssText += 'position:static;width:110px;height:110px;font-size:32px;margin-top:24px;';
  o.stamp = st;
  o.update = (t, local) => {
    revealChars(o.chars, t, local + 0.15, 0.06, 0.5, 26);
    const p = clamp((t - local - 0.8) / 0.7, 0, 1);
    o.sub.style.opacity = p; o.sub.style.transform = `translateY(${(1 - p) * 14}px)`;
    const hp = clamp((t - local - 1.6) / 0.8, 0, 1);
    o.hint.style.opacity = hp * .85;
    stamp(o.stamp, t, local + 1.1);
  };
  return o;
}

const BUILDERS = { title: buildTitle, scene: buildScene, quote: buildQuote, cards: buildCards,
  split: buildSplit, steps: buildSteps, bigline: buildBigline, qa: buildQA, list: buildList, end: buildEnd };

/* ---------- 组装 ---------- */
function build() {
  document.getElementById('chapter').textContent = DATA.kicker || '';
  document.getElementById('epno').textContent = DATA.epno || '';
  DATA_BEATS.forEach((b, i) => {
    const builder = BUILDERS[b.layout] || buildScene;
    const o = builder(b);
    o.node.style.zIndex = String(10 + i);
    scenes.push(o);
  });
  window.__DURATION = DATA.duration;
  const subs = document.getElementById('subs');
  window.__subCues = [];
  window.__setSubs = (cues, raiseAfter) => {
    subs.innerHTML = '';
    window.__subCues = (cues || []).map(c => {
      const d = el('div', 'cue', subs);
      const sp = el('span', '', d);
      sp.textContent = c.text;
      return { node: d, start: c.start, end: c.end, raise: raiseAfter };
    });
  };
}

function render(t) {
  const dur = window.__DURATION;
  document.getElementById('progress').style.width = `${clamp(t / dur, 0, 1) * 100}%`;
  scenes.forEach((o, i) => {
    const b = o.b;
    const next = DATA_BEATS[i + 1];
    const fadeIn = 0.5, fadeOut = 0.55;
    let op = 0;
    if (t >= b.start - 0.05 && (!next || t <= next.start + fadeOut)) {
      if (t < b.start + fadeIn) op = smooth((t - b.start) / fadeIn);
      else if (next && t > next.start) op = 1 - smooth((t - next.start) / fadeOut);
      else op = 1;
      if (i === 0 && t < b.start) op = smooth((t - b.start + 0.6) / 0.6);
    }
    o.node.style.opacity = op;
    o.node.style.visibility = op > 0.001 ? 'visible' : 'hidden';
    if (op > 0.001) {
      const drift = clamp((t - b.start) / Math.max(0.1, b.end - b.start), 0, 1);
      o.node.style.transform = `translateY(${(1 - op) * 10}px)`;
      if (o.update) o.update(t, b.start);
    }
  });
  // 字幕
  (window.__subCues || []).forEach(c => {
    const on = t >= c.start && t <= c.end && (!c.raise || t < c.raise);
    const local = t - c.start;
    const p = Math.min(clamp(local / 0.12, 0, 1), clamp((c.end - t) / 0.14, 0, 1));
    c.node.style.opacity = on ? p : 0;
    c.node.style.transform = `translateY(${(1 - p) * 10}px)`;
  });
  const dark = document.getElementById('dark');
  const tail = DATA.tail || 0;
  dark.style.opacity = t > dur - tail ? clamp((t - (dur - tail)) / tail, 0, 1) : 0;
}

build();
if (location.search.includes('record')) { document.body.classList.add('record'); }
window.__seek = async (t) => { render(t); await new Promise(r => requestAnimationFrame(r)); };
render(0);
(async () => {
  const imgs = Array.from(document.images);
  await Promise.all(imgs.map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve())));
  try { await document.fonts.ready; } catch (e) {}
  // 字体真正可用：等两个字重各测一次
  try { await document.fonts.load('40px Mashan'); await document.fonts.load('40px Kai');
        await document.fonts.load('40px Brush'); } catch (e) {}
  await new Promise(r => setTimeout(r, 60));
  window.__ready = true;
})();
